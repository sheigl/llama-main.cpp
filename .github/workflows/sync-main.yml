name: Sync fork with upstream (master + SYCL PRs)

# Sync model:
# - Default (scheduled run or dispatch with no inputs): merge upstream ggml-org/llama.cpp master only.
# - Dispatch with a PR number: merge upstream master + that specific PR.
# - include_sycl=true (opt-in): additionally merge all open SYCL-labeled PRs.

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number from ggml-org/llama.cpp to also merge (e.g. 26689). Leave empty to merge only upstream master.'
        type: string
        required: false
        default: ''
      include_sycl:
        description: 'Also merge all open SYCL-labeled PRs from ggml-org/llama.cpp (opt-in; off by default)'
        type: boolean
        required: false
        default: false

concurrency:
  group: sync-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Add upstream remote and fetch
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/ggml-org/llama.cpp.git
          git fetch upstream master
          git fetch upstream '+refs/pull/*/head:refs/remotes/upstream/pr/*'

      - name: Merge upstream master, SYCL PRs, and requested PR
        env:
          INCLUDE_SYCL: ${{ inputs.include_sycl }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail

          # Fail fast on an invalid pr_number input before doing any merges
          if [[ -n "$PR_NUMBER" && ! "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::pr_number must be a positive integer, got '$PR_NUMBER'"
            exit 1
          fi

          # git merge commits need an identity on the runner
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          merge_ref() {
            local ref="$1"
            echo "::group::Merging $ref"
            if ! git merge --no-edit "$ref"; then
              echo "::error::failed to merge $ref (conflict or error)"
              git merge --abort 2>/dev/null || true
              echo "::endgroup::"
              exit 1
            fi
            echo "::endgroup::"
          }

          # (a) Merge upstream master
          merge_ref upstream/master

          # (b) Merge all open SYCL-labeled PRs
          if [[ "$INCLUDE_SYCL" == "true" ]]; then
            prs=$(gh pr list --repo ggml-org/llama.cpp --label SYCL --state open --json number --jq '.[].number')
            if [[ -z "$prs" ]]; then
              echo "no SYCL PRs to merge"
            else
              for n in $prs; do
                merge_ref "upstream/pr/$n"
              done
            fi
          else
            echo "include_sycl=false: skipping SYCL PR merges"
          fi

          # (c) Merge an explicitly requested PR (if any)
          if [[ -n "$PR_NUMBER" ]]; then
            pr="$PR_NUMBER"
            echo "::group::Fetching upstream pull/$pr/head"
            if ! git fetch upstream "pull/$pr/head"; then
              echo "::error::PR #$pr not found in upstream ggml-org/llama.cpp"
              echo "::endgroup::"
              exit 1
            fi
            echo "::endgroup::"
            merge_ref FETCH_HEAD
          fi

      - name: Push to fork master
        run: |
          set -euo pipefail
          git fetch origin master
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/master)" ]]; then
            git push origin master
          else
            echo "no changes to push"
          fi
